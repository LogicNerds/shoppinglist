<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDK My Shopping List</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --teal: #0d9488;
    --teal-dark: #0f766e;
    --navy: #1a3a4a;
    --navy-dark: #0f2330;
  }

  html, body {
    height: 100%;
    font-family: 'DM Sans', 'Segoe UI', sans-serif;
    background: var(--navy-dark);
    color: white;
    overflow-x: hidden;
  }

  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    position: relative;
    background: linear-gradient(160deg, #0f2330 0%, #1a3a4a 50%, #0a1f2b 100%);
  }

  .bg-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(13,148,136,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(13,148,136,0.06) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
  }

  .bg-glow {
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(13,148,136,0.12) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  .content {
    position: relative;
    z-index: 1;
    text-align: center;
    max-width: 540px;
    width: 100%;
  }

  .logo {
    font-size: 3.5rem;
    line-height: 1;
    margin-bottom: 32px;
    display: block;
    animation: drop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  @keyframes drop {
    from { opacity: 0; transform: translateY(-20px) scale(0.8); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .headline {
    font-family: 'Bebas Neue', 'Impact', sans-serif;
    font-size: clamp(4rem, 14vw, 7rem);
    line-height: 0.9;
    letter-spacing: 0.02em;
    color: white;
    margin-bottom: 24px;
    animation: rise 0.7s 0.1s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  .headline span {
    display: block;
    color: var(--teal);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .subhead {
    font-size: clamp(1rem, 3vw, 1.2rem);
    color: rgba(255,255,255,0.6);
    font-weight: 400;
    margin-bottom: 48px;
    letter-spacing: 0.01em;
    animation: rise 0.7s 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  .cta {
    display: inline-block;
    background: var(--teal);
    color: white;
    font-family: 'DM Sans', 'Segoe UI', sans-serif;
    font-size: 1.1rem;
    font-weight: 500;
    padding: 18px 52px;
    border-radius: 6px;
    text-decoration: none;
    letter-spacing: 0.03em;
    transition: background 0.2s, transform 0.15s;
    animation: rise 0.7s 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    cursor: pointer;
    border: none;
  }

  .cta:hover {
    background: var(--teal-dark);
    transform: translateY(-2px);
  }

  .cta:active {
    transform: translateY(0);
  }

  .footer-text {
    position: absolute;
    bottom: 20px;
    font-size: 0.75rem;
    color: rgba(255,255,255,0.25);
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<div class="page">
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <div class="content">
    <span class="logo">💸</span>
    <h1 class="headline">
      Know before<span>you checkout.</span>
    </h1>
    <p class="subhead">Grocery shopping shouldn't feel like roulette.</p>
    <a class="cta" href="app.html">Go Shopping</a>
  </div>

  <p class="footer-text">© 2026 Logic Nerds. All Rights Reserved.</p>
</div>
</body>
</html>
